name: Build and publish app note

on:
    release:
        types: created

jobs:
    build_and_publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  ref: main

            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
              with:
                  enable-cache: true
                  version: latest

            - name: Set up Python
              run: uv python install

            - name: Install dependencies
              run: uv sync --frozen --no-dev

            - name: Build documentation
              run: make html

            - name: Publish HTML
              uses: appleboy/scp-action@v1
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                port: ${{ secrets.PORT }}
                key: ${{ secrets.KEY }}
                source: ./build/html/*
                target: ${{ secrets.TARGETHTML }}
                strip_components: 2
                rm: true

            - name: zip application note
              run: |
                  mkdir app_note
                  mv ./build/html ./app_note/html
                  (cd app_note && zip -r ../app_note.zip .)

            - name: Upload documentation as release asset
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  gh release upload ${{ github.event.release.tag_name }} ./app_note.zip
