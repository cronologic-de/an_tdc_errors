name: Build and publish app note

on:
  release:
    types:
      created

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: main

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        version: latest

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --frozen --no-dev

    - name: Build documentation
      run: make html

    - name: Upload HTML to artifacts
      uses: actions/upload-artifact@v7
      with:
        name: html
        path: build/html

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: main

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./artifacts

    - name: Publish HTML
      uses: appleboy/scp-action@1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.KEY }}
        source: ./artifacts/html/*
        target: ${{ secrets.TARGETHTML }}
        strip_components: 2
        rm: true

    - name: zip application note
      run: |
        mkdir app_note
        mv ./artifacts/html ./app_note/html
        (cd app_note && zip -r ../app_note.zip .)

    - name: Upload documentation as release asset
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        gh release upload ${{ github.event.release.tag_name }} ./app_note.zip
